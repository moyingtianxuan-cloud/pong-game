<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="scoreboard" aria-label="Scoreboard">
        <div id="left-score" class="score">0</div>
        <div class="divider">:</div>
        <div id="right-score" class="score">0</div>
      </div>

      <div id="game-area" class="game-area" aria-label="Pong game area">
        <div id="left-paddle" class="paddle left"></div>
        <div id="right-paddle" class="paddle right"></div>
        <div id="ball" class="ball"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
